name: "Deploy — API Service (dev)"

on:
  push:
    branches: [dev]
    paths:
      - "services/api/**"
      - "services/core/**"        # core es dependencia de api
      - ".github/workflows/deploy-api-dev.yaml"
  workflow_dispatch:
    inputs:
      skip-tests:
        description: "Omitir tests (solo en emergencias)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: "Test"
    if: ${{ !inputs.skip-tests }}
    uses: ./.github/workflows/shared-lint-and-test-backend.yaml
    with:
      service-path: services/api
      coverage-threshold: 60

  build:
    name: "Build"
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    uses: ./.github/workflows/shared-build-and-push-backend.yaml
    with:
      service-path: services/api
      registry: us-central1-docker.pkg.dev
      tag: dev
      environment: dev
    secrets:
      project-id: ${{ secrets.GCP_PROJECT_ID }}
      workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

  deploy:
    name: "Deploy"
    needs: [build]
    if: needs.build.result == 'success'
    uses: ./.github/workflows/shared-deploy-cloudrun.yaml
    with:
      service-name: slate-api-dev
      image-registry: ${{ needs.build.outputs.registry }}
      image-service-name: ${{ needs.build.outputs.service-name }}
      image-tag: ${{ needs.build.outputs.image-tag }}
      environment: dev
      memory: 512Mi
      cpu: "1"
      min-instances: 0
      max-instances: 5
      timeout: 300s
      runtime-service-account: poc-api@lennken-poc.iam.gserviceaccount.com
      allow-unauthenticated: false
      enable-iap: true
      iap-client-id: /projects/43634032496/locations/us-central1/services/slate-api-dev
      vpc-network: default
      vpc-subnet: poc-cloudrun-subnet
      cloudrun-secrets: |
        DATABASE_URL=poc-database-dev-url:latest
    secrets:
      project-id: ${{ secrets.GCP_PROJECT_ID }}
      workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
