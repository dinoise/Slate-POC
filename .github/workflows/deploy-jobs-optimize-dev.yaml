name: "Deploy — Jobs: optimize (dev)"

on:
  push:
    branches: [dev]
    paths:
      - "services/jobs/**"
      - "services/core/**"
      - "services/shared-infra/**"
      - ".github/workflows/deploy-jobs-optimize-dev.yaml"
      - ".github/workflows/shared-deploy-cloudrun-job.yaml"
  workflow_dispatch:
    inputs:
      skip-tests:
        description: "Omitir tests"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: "Test"
    if: ${{ !inputs.skip-tests }}
    uses: ./.github/workflows/shared-lint-and-test-backend.yaml
    with:
      service-path: services/jobs
      coverage-threshold: 60

  build:
    name: "Build"
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    uses: ./.github/workflows/shared-build-and-push-backend.yaml
    with:
      service-path: services/jobs
      registry: us-central1-docker.pkg.dev
      tag: dev
      environment: dev
    secrets:
      project-id: ${{ secrets.GCP_PROJECT_ID }}
      workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

  deploy:
    name: "Deploy"
    needs: [build]
    if: needs.build.result == 'success'
    uses: ./.github/workflows/shared-deploy-cloudrun-job.yaml
    with:
      image-registry:      ${{ needs.build.outputs.registry }}
      image-service-name:  ${{ needs.build.outputs.service-name }}
      image-tag:           ${{ needs.build.outputs.image-tag }}
      job-name:            slate-jobs-optimize-dev
      command:             optimize
      memory:              2Gi
      cpu:                 "2"
      task-timeout:        7200s
      max-retries:         1
      runtime-service-account: poc-jobs@lennken-poc.iam.gserviceaccount.com
      vpc-subnet:          poc-cloudrun-subnet
      cloudrun-secrets: |
        DATABASE_URL=poc-database-dev-url:latest
    secrets:
      project-id:                  ${{ secrets.GCP_PROJECT_ID }}
      workload-identity-provider:  ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
