name: "[Shared] Deploy — Cloud Run"

on:
  workflow_call:
    inputs:
      image-registry:
        description: "Registry base, e.g. us-central1-docker.pkg.dev"
        required: true
        type: string
      image-service-name:
        description: "Nombre del servicio en Artifact Registry (basename del service-path)"
        required: true
        type: string
      image-tag:
        description: "Tag de la imagen, e.g. dev-abc1234-1234567890"
        required: true
        type: string
      service-name:
        description: "Nombre del servicio Cloud Run"
        required: true
        type: string
      region:
        required: false
        type: string
        default: "us-central1"
      environment:
        required: false
        type: string
        default: "dev"
      memory:
        required: false
        type: string
        default: "512Mi"
      cpu:
        required: false
        type: string
        default: "1"
      min-instances:
        required: false
        type: number
        default: 0
      max-instances:
        required: false
        type: number
        default: 5
      timeout:
        required: false
        type: string
        default: "300s"
      allow-unauthenticated:
        required: false
        type: boolean
        default: false
      runtime-service-account:
        description: "Service account que ejecuta el contenedor (runtime). Si se omite, usa la SA por defecto del proyecto."
        required: false
        type: string
        default: ""
      vpc-network:
        description: "Nombre de la VPC para Direct VPC Egress (e.g. default). Omitir si no se necesita VPC."
        required: false
        type: string
        default: ""
      vpc-subnet:
        description: "Nombre del subnet para Direct VPC Egress (e.g. poc-cloudrun-subnet)."
        required: false
        type: string
        default: ""
      vpc-egress:
        description: "Modo de egress VPC: all-traffic | private-ranges-only"
        required: false
        type: string
        default: "private-ranges-only"
      enable-iap:
        description: "Configurar el IAM binding para el service agent de IAP (roles/run.invoker). Requiere que IAP esté activado previamente en el servicio desde GCP Console."
        required: false
        type: boolean
        default: false
      iap-client-id:
        description: "OAuth2 client ID de IAP (formato: NNNNNN-abc.apps.googleusercontent.com). Requerido cuando enable-iap=true para que el health check use el audience correcto."
        required: false
        type: string
        default: ""
      health-check-path:
        description: "Path del health check, e.g. /health o /healthz"
        required: false
        type: string
        default: "/health"
      cloudrun-secrets:
        description: |
          Secrets de GCP Secret Manager a montar como env vars en el contenedor.
          Formato multilínea (un par por línea): ENV_VAR=gcp-secret-name:version
          Convención de nombres: poc-{recurso}-{env}-{proposito}
          Ejemplo:
            DATABASE_URL=poc-database-dev-url:latest
            SECRET_KEY=poc-api-dev-secret-key:latest
        required: false
        type: string
        default: ""
    secrets:
      project-id:
        required: true
      workload-identity-provider:
        required: true
    outputs:
      service-url:
        value: ${{ jobs.deploy.outputs.service-url }}

jobs:
  deploy:
    name: "Deploy → Cloud Run (${{ inputs.service-name }})"
    runs-on: ubuntu-latest
    outputs:
      service-url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.workload-identity-provider }}
          service_account: poc-deployer@${{ secrets.project-id }}.iam.gserviceaccount.com

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.project-id }}

      - name: Deploy a Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service-name }}
          image: ${{ inputs.image-registry }}/${{ secrets.project-id }}/poc-images/${{ inputs.image-service-name }}:${{ inputs.image-tag }}
          region: ${{ inputs.region }}
          secrets: ${{ inputs.cloudrun-secrets }}
          flags: >-
            --memory=${{ inputs.memory }}
            --cpu=${{ inputs.cpu }}
            --min-instances=${{ inputs.min-instances }}
            --max-instances=${{ inputs.max-instances }}
            --timeout=${{ inputs.timeout }}
            --set-env-vars=ENVIRONMENT=${{ inputs.environment }}
            ${{ inputs.allow-unauthenticated && '--allow-unauthenticated' || '--no-allow-unauthenticated' }}
            ${{ inputs.runtime-service-account != '' && format('--service-account={0}', inputs.runtime-service-account) || '' }}
            ${{ inputs.vpc-network != '' && format('--network={0} --subnet={1} --vpc-egress={2}', inputs.vpc-network, inputs.vpc-subnet, inputs.vpc-egress) || '' }}

      - name: Configurar IAM binding para IAP
        if: inputs.enable-iap
        run: |
          PROJECT_NUMBER=$(gcloud projects describe ${{ secrets.project-id }} \
            --format="value(projectNumber)")
          IAP_SA="serviceAccount:service-${PROJECT_NUMBER}@gcp-sa-iap.iam.gserviceaccount.com"
          echo "🔐 Asignando roles/run.invoker a ${IAP_SA}"
          gcloud run services add-iam-policy-binding ${{ inputs.service-name }} \
            --member="${IAP_SA}" \
            --role="roles/run.invoker" \
            --region=${{ inputs.region }} \
            --project=${{ secrets.project-id }}
          echo "✅ IAP service agent configurado"

      - name: Health check
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          SERVICE_URL="${SERVICE_URL%/}"
          echo "🔍 Health check → ${SERVICE_URL}${{ inputs.health-check-path }}"

          # Cuando IAP está activo, el audience debe ser el OAuth2 client ID de IAP,
          # NO la service URL. IAP valida el JWT audience antes de forwarding al contenedor.
          # Sin IAP, se usa la service URL como audience (validado por Cloud Run directamente).
          IAP_CLIENT_ID="${{ inputs.iap-client-id }}"
          if [ -n "${IAP_CLIENT_ID}" ]; then
            AUDIENCE="${IAP_CLIENT_ID}"
            echo "🔐 Modo IAP — audience: ${AUDIENCE}"
          else
            AUDIENCE="${SERVICE_URL}"
            echo "🔓 Sin IAP — audience: ${AUDIENCE}"
          fi

          # WIF no soporta --audiences directamente — se impersona la SA deployer.
          # Requiere: roles/iam.serviceAccountTokenCreator en poc-deployer (SA resource)
          #           roles/run.invoker en el servicio Cloud Run para poc-deployer
          ID_TOKEN=$(gcloud auth print-identity-token \
            --impersonate-service-account="poc-deployer@${{ secrets.project-id }}.iam.gserviceaccount.com" \
            --audiences="${AUDIENCE}" \
            --include-email)

          MAX_ATTEMPTS=5
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${ID_TOKEN}" \
              "${SERVICE_URL}${{ inputs.health-check-path }}")
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "✅ Health check OK (intento ${ATTEMPT}) — HTTP ${HTTP_CODE}"
              exit 0
            fi
            echo "⏳ Intento ${ATTEMPT}/${MAX_ATTEMPTS} fallido — HTTP ${HTTP_CODE} — esperando 5s..."
            sleep 5
            ATTEMPT=$((ATTEMPT + 1))
          done
          echo "❌ Health check falló después de ${MAX_ATTEMPTS} intentos"
          exit 1

      - name: Resumen de deploy
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI="✅"
          if [ "$STATUS" != "success" ]; then EMOJI="❌"; fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "${EMOJI} Deploy ${{ inputs.service-name }} — ${STATUS}"
          echo "🔗 URL: ${{ steps.deploy.outputs.url }}"
          echo "🐳 Image: ${{ inputs.image-registry }}/${{ secrets.project-id }}/poc-images/${{ inputs.image-service-name }}:${{ inputs.image-tag }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "👤 Actor: ${{ github.actor }}"
          echo "🔖 Commit: ${{ github.sha }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
