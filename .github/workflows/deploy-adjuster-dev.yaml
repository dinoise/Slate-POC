name: "Deploy — Adjuster App (dev)"

on:
  push:
    branches: [dev]
    paths:
      - "apps/adjuster/**"
      - "packages/**"
      - ".github/workflows/deploy-adjuster-dev.yaml"
      - ".github/workflows/shared-build-and-push-frontend.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: "Test"
    uses: ./.github/workflows/shared-lint-and-test-frontend.yaml
    with:
      app-path: apps/adjuster
      coverage-threshold: 70

  build-and-deploy:
    name: "Build & Deploy"
    needs: [test]
    uses: ./.github/workflows/shared-build-and-push-frontend.yaml
    with:
      app-path: apps/adjuster
      bucket: slate-app-dev
      bucket-prefix: adjuster
      environment: dev
    secrets:
      project-id: ${{ secrets.GCP_PROJECT_ID }}
      workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      vite-api-base-url: ${{ secrets.VITE_API_BASE_URL_DEV }}
      vite-notifications-url: ${{ secrets.VITE_NOTIFICATIONS_URL_DEV }}
