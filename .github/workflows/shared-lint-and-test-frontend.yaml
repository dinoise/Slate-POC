name: "[Shared] Lint & Test — Frontend"

on:
  workflow_call:
    inputs:
      app-path:
        description: "Path de la app, e.g. apps/admin"
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: "20"
      coverage-threshold:
        required: false
        type: number
        default: 70
    outputs:
      coverage-percentage:
        value: ${{ jobs.lint-and-test.outputs.coverage-percentage }}
      tests-passed:
        value: ${{ jobs.lint-and-test.outputs.tests-passed }}

jobs:
  lint-and-test:
    name: "Lint & Test — ${{ inputs.app-path }}"
    runs-on: ubuntu-latest
    outputs:
      coverage-percentage: ${{ steps.coverage.outputs.percentage }}
      tests-passed: ${{ steps.tests.outputs.passed }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm --filter $(basename ${{ inputs.app-path }}) lint

      - name: Type check (tsc)
        run: pnpm --filter $(basename ${{ inputs.app-path }}) type-check

      - name: Tests con coverage
        id: tests
        run: |
          pnpm --filter $(basename ${{ inputs.app-path }}) test:coverage
          echo "passed=true" >> $GITHUB_OUTPUT

      - name: Extraer porcentaje de coverage
        id: coverage
        if: always()
        run: |
          COVERAGE=$(node -e "
            const fs = require('fs');
            try {
              const s = JSON.parse(fs.readFileSync('${{ inputs.app-path }}/coverage/coverage-summary.json', 'utf8'));
              console.log(s.total.lines.pct);
            } catch { console.log('0'); }
          " 2>/dev/null || echo "0")
          echo "percentage=${COVERAGE}" >> $GITHUB_OUTPUT

      - name: Preparar nombre de artifact
        if: always()
        run: |
          SAFE_PATH=$(echo "${{ inputs.app-path }}" | tr '/' '-')
          echo "ARTIFACT_NAME=coverage-${SAFE_PATH}-${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ inputs.app-path }}/coverage/
          retention-days: 7

      - name: Comentar coverage en PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.percentage }}';
            const passed = '${{ steps.tests.outputs.passed }}' === 'true';
            const emoji = passed ? '✅' : '❌';
            const body = [
              `## ${emoji} Tests Results — \`${{ inputs.app-path }}\``,
              '',
              `| Métrica | Valor |`,
              `|---------|-------|`,
              `| Coverage | ${coverage}% |`,
              `| Umbral | ${{ inputs.coverage-threshold }}% |`,
              `| Estado | ${passed ? '✅ PASS' : '❌ FAIL'} |`,
              '',
              `> Commit: \`${context.sha.slice(0,7)}\``,
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Tests Results') &&
              c.body.includes('${{ inputs.app-path }}')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
