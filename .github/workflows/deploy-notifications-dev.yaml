name: "Deploy — Notifications Service (dev)"

on:
  push:
    branches: [dev]
    paths:
      - "services/notifications/**"
      - "services/core/**"
      - ".github/workflows/deploy-notifications-dev.yaml"
      - ".github/workflows/shared-build-and-push-backend.yaml"
      - ".github/workflows/shared-deploy-cloudrun.yaml"
  workflow_dispatch:
    inputs:
      skip-tests:
        description: "Omitir tests"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: "Test"
    if: ${{ !inputs.skip-tests }}
    uses: ./.github/workflows/shared-lint-and-test-backend.yaml
    with:
      service-path: services/notifications
      coverage-threshold: 60

  build:
    name: "Build"
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    uses: ./.github/workflows/shared-build-and-push-backend.yaml
    with:
      service-path: services/notifications
      registry: us-central1-docker.pkg.dev
      tag: dev
      environment: dev
    secrets:
      project-id: ${{ secrets.GCP_PROJECT_ID }}
      workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

  deploy:
    name: "Deploy"
    needs: [build]
    uses: ./.github/workflows/shared-deploy-cloudrun.yaml
    with:
      image-full: ${{ needs.build.outputs.image-full }}
      service-name: slate-notifications-dev
      region: us-central1
      environment: dev
      memory: 512Mi
      cpu: "0.5"
      min-instances: 1          # SSE: siempre activo — cold start mataría conexiones activas
      max-instances: 1          # CRÍTICO: NotificationBroadcaster usa asyncio.Queue en memoria.
                                # Con >1 instancia, eventos pg_notify llegan a instancia aleatoria
                                # y los adjusters conectados en otra instancia no los reciben.
                                # Para escalar horizontalmente: agregar Redis Pub/Sub como broker.
      timeout: 3600s            # Conexiones SSE long-lived (hasta 1 hora)
    secrets:
      project-id: ${{ secrets.GCP_PROJECT_ID }}
      workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      database-url: ${{ secrets.DATABASE_URL_DEV }}
