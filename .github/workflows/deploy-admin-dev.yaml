name: "Deploy — Admin App (dev)"

on:
  push:
    branches: [dev]
    paths:
      - "apps/admin/**"
      - "packages/**"
      - ".github/workflows/deploy-admin-dev.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: "Test"
    uses: ./.github/workflows/shared-lint-and-test-frontend.yaml
    with:
      app-path: apps/admin
      coverage-threshold: 0

  build:
    name: "Build"
    needs: [test]
    uses: ./.github/workflows/shared-build-and-push-frontend.yaml
    with:
      app-path: apps/admin
      registry: us-central1-docker.pkg.dev
      tag: dev
      environment: dev
      vite-api-base-url: https://slate-api-dev-43634032496.us-central1.run.app
      vite-notifications-url: https://slate-notifications-dev-43634032496.us-central1.run.app
      vite-google-client-id: 43634032496-8v7hjv5vt6thptt6huacv386kje52rqt.apps.googleusercontent.com
    secrets:
      project-id: ${{ secrets.GCP_PROJECT_ID }}
      workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

  deploy:
    name: "Deploy"
    needs: [build]
    if: needs.build.result == 'success'
    uses: ./.github/workflows/shared-deploy-cloudrun.yaml
    with:
      service-name: slate-admin-dev
      image-registry: ${{ needs.build.outputs.registry }}
      image-service-name: ${{ needs.build.outputs.service-name }}
      image-tag: ${{ needs.build.outputs.image-tag }}
      environment: dev
      memory: 256Mi
      cpu: "0.5"
      min-instances: 0
      max-instances: 2
      timeout: 60s
      runtime-service-account: poc-admin@lennken-poc.iam.gserviceaccount.com
      allow-unauthenticated: false
      enable-iap: true
      skip-health-check: true
      health-check-path: /healthz
    secrets:
      project-id: ${{ secrets.GCP_PROJECT_ID }}
      workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
