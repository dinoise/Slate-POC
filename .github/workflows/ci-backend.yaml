name: "CI — Backend"

on:
  push:
    branches: [main, develop]
    paths:
      - "services/**"
      - "alembic/**"
      - ".github/workflows/ci-backend.yaml"
      - ".github/workflows/shared-lint-and-test-backend.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/**"
      - "alembic/**"
      - ".github/workflows/ci-backend.yaml"
      - ".github/workflows/shared-lint-and-test-backend.yaml"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Cada servicio corre en paralelo — falla independientemente
  test-api:
    name: "API Service"
    uses: ./.github/workflows/shared-lint-and-test-backend.yaml
    with:
      service-path: services/api
      coverage-threshold: 70

  test-notifications:
    name: "Notifications Service"
    uses: ./.github/workflows/shared-lint-and-test-backend.yaml
    with:
      service-path: services/notifications
      coverage-threshold: 60

  test-jobs:
    name: "Jobs Service"
    uses: ./.github/workflows/shared-lint-and-test-backend.yaml
    with:
      service-path: services/jobs
      coverage-threshold: 60

  # Gate para PRs — requiere que todos pasen
  all-backend-pass:
    name: "All Backend Tests Pass"
    needs: [test-api, test-notifications, test-jobs]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verificar resultados
        run: |
          API="${{ needs.test-api.result }}"
          NOTIF="${{ needs.test-notifications.result }}"
          JOBS="${{ needs.test-jobs.result }}"
          echo "api=${API} | notifications=${NOTIF} | jobs=${JOBS}"
          if [ "$API" = "failure" ] || [ "$NOTIF" = "failure" ] || [ "$JOBS" = "failure" ]; then
            echo "❌ Uno o más servicios backend fallaron"
            exit 1
          fi
          echo "✅ Todos los servicios backend pasaron"
