name: "Deploy — Agents (dev)"

on:
  push:
    branches: [dev]
    paths:
      - "services/agents/**"
      - ".github/workflows/deploy-agents-dev.yaml"
  workflow_dispatch:
    inputs:
      skip-tests:
        description: "Omitir tests (solo en emergencias)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  GOOGLE_CLOUD_LOCATION: us-central1
  ROOT_AGENT_MODEL: gemini-2.5-flash-lite

jobs:
  # ── 1. Tests ──────────────────────────────────────────────────────────────────
  test:
    name: "Test"
    if: ${{ !inputs.skip-tests }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short

  # ── 2. Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy to Agent Engine"
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agents

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (with ADK)
        run: uv sync

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: poc-deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate environment
        run: |
          uv run python deployment/deploy.py --validate
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ env.GOOGLE_CLOUD_LOCATION }}
          ROOT_AGENT_MODEL: ${{ env.ROOT_AGENT_MODEL }}
          SLATE_API_URL: ${{ secrets.SLATE_API_URL_DEV }}

      - name: Deploy to Vertex AI Agent Engine
        id: deploy
        run: |
          # Write runtime env vars to a temp .env file passed via --env_file.
          # adk deploy agent_engine does not accept --env_vars (removed in ADK 1.x).
          cat > /tmp/agents_runtime.env <<EOF
          GOOGLE_GENAI_USE_VERTEXAI=1
          GOOGLE_CLOUD_PROJECT=${{ env.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION=${{ env.GOOGLE_CLOUD_LOCATION }}
          ROOT_AGENT_MODEL=${{ env.ROOT_AGENT_MODEL }}
          SLATE_API_URL=${{ secrets.SLATE_API_URL_DEV }}
          EOF

          # Agent Engine needs a requirements.txt to populate deploymentSpec.
          # Write to /tmp so the path is absolute and survives ADK's temp dir copy.
          uv export --no-hashes --no-dev \
            | grep -v "^-e " | grep -v "^\s*#" | grep -v "^$" \
            > /tmp/agents_requirements.txt
          echo "Generated $(wc -l < /tmp/agents_requirements.txt) packages"

          uv run adk deploy agent_engine \
            --project=${{ env.GOOGLE_CLOUD_PROJECT }} \
            --region=${{ env.GOOGLE_CLOUD_LOCATION }} \
            --display_name="slate-agents-dev" \
            --adk_app_object=app \
            --env_file=/tmp/agents_runtime.env \
            --requirements_file=/tmp/agents_requirements.txt \
            src/slate_agents/ 2>&1 | tee deploy_output.txt

          # Extract the Agent Engine ID from the output for the health check
          AGENT_ENGINE_ID=$(grep -oP 'reasoningEngines/\K[0-9]+' deploy_output.txt | tail -1)
          echo "agent_engine_id=$AGENT_ENGINE_ID" >> "$GITHUB_OUTPUT"
          echo "Deployed Agent Engine ID: $AGENT_ENGINE_ID"

      - name: Health check
        if: steps.deploy.outputs.agent_engine_id != ''
        run: |
          uv run python deployment/deploy.py \
            --health \
            --agent-engine-id=${{ steps.deploy.outputs.agent_engine_id }}
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ env.GOOGLE_CLOUD_LOCATION }}
