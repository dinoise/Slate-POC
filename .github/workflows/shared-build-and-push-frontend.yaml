name: "[Shared] Build & Deploy — Frontend (Cloud Storage)"

on:
  workflow_call:
    inputs:
      app-path:
        description: "Path de la app, e.g. apps/admin"
        required: true
        type: string
      bucket:
        description: "Nombre del bucket GCS, e.g. slate-app-dev"
        required: true
        type: string
      bucket-prefix:
        description: "Subdirectorio dentro del bucket, e.g. admin"
        required: false
        type: string
        default: ""
      environment:
        required: false
        type: string
        default: "dev"
      node-version:
        required: false
        type: string
        default: "20"
    secrets:
      project-id:
        required: true
      workload-identity-provider:
        required: true
      vite-api-base-url:
        required: true
      vite-notifications-url:
        required: false
    outputs:
      public-url:
        value: ${{ jobs.build-and-deploy.outputs.public-url }}

jobs:
  build-and-deploy:
    name: "Build & Deploy — ${{ inputs.app-path }}"
    runs-on: ubuntu-latest
    outputs:
      public-url: ${{ steps.deploy.outputs.public-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          VITE_API_BASE_URL: ${{ secrets.vite-api-base-url }}
          VITE_NOTIFICATIONS_URL: ${{ secrets.vite-notifications-url }}
          VITE_ENVIRONMENT: ${{ inputs.environment }}
        run: pnpm --filter $(basename ${{ inputs.app-path }}) build

      - name: Configurar credenciales GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.workload-identity-provider }}
          service_account: poc-deployer@${{ secrets.project-id }}.iam.gserviceaccount.com

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.project-id }}

      - name: Deploy a Cloud Storage
        id: deploy
        run: |
          DEST="gs://${{ inputs.bucket }}"
          if [ -n "${{ inputs.bucket-prefix }}" ]; then
            DEST="${DEST}/${{ inputs.bucket-prefix }}"
          fi

          echo "📦 Subiendo ${{ inputs.app-path }}/dist → ${DEST}"
          gsutil -m rsync -r -d ${{ inputs.app-path }}/dist "${DEST}"

          # Configurar cache: HTML sin cache, assets con cache largo
          gsutil -m setmeta -h "Cache-Control:no-cache, no-store" "${DEST}/index.html" 2>/dev/null || true
          gsutil -m setmeta -h "Cache-Control:public, max-age=31536000" "${DEST}/assets/**" 2>/dev/null || true

          PUBLIC_URL="https://storage.googleapis.com/${{ inputs.bucket }}"
          if [ -n "${{ inputs.bucket-prefix }}" ]; then
            PUBLIC_URL="${PUBLIC_URL}/${{ inputs.bucket-prefix }}/index.html"
          else
            PUBLIC_URL="${PUBLIC_URL}/index.html"
          fi

          echo "public-url=${PUBLIC_URL}" >> $GITHUB_OUTPUT
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deploy completado"
          echo "🔗 URL: ${PUBLIC_URL}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
