name: "[Shared] Build & Push — Frontend"

on:
  workflow_call:
    inputs:
      app-path:
        description: "Path de la app, e.g. apps/adjuster"
        required: true
        type: string
      registry:
        description: "Registry base, e.g. us-central1-docker.pkg.dev"
        required: true
        type: string
      tag:
        required: false
        type: string
        default: "dev"
      environment:
        required: false
        type: string
        default: "dev"
    secrets:
      project-id:
        required: true
      workload-identity-provider:
        required: true
      vite-api-base-url:
        required: true
      vite-notifications-url:
        required: false
    outputs:
      image-tag:
        value: ${{ jobs.build.outputs.image-tag }}
      service-name:
        value: ${{ jobs.build.outputs.service-name }}
      registry:
        value: ${{ jobs.build.outputs.registry }}

jobs:
  build:
    name: "Build & Push — ${{ inputs.app-path }}"
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      service-name: ${{ steps.meta.outputs.service-name }}
      registry: ${{ steps.meta.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Generar metadata de imagen
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TIMESTAMP=$(date +%s)
          IMAGE_TAG="${{ inputs.tag }}-${SHORT_SHA}-${TIMESTAMP}"
          SERVICE_NAME=$(basename ${{ inputs.app-path }})
          IMAGE_FULL="${{ inputs.registry }}/${{ secrets.project-id }}/poc-images/${SERVICE_NAME}:${IMAGE_TAG}"
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image-full=${IMAGE_FULL}" >> $GITHUB_OUTPUT
          echo "service-name=${SERVICE_NAME}" >> $GITHUB_OUTPUT
          echo "registry=${{ inputs.registry }}" >> $GITHUB_OUTPUT
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🐳 Image: ${IMAGE_FULL}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Configurar credenciales GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.workload-identity-provider }}
          service_account: poc-deployer@${{ secrets.project-id }}.iam.gserviceaccount.com

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.project-id }}

      - name: Autenticar Docker con Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.registry }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image-full }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.image-tag }}
            APP_PATH=${{ inputs.app-path }}
            ENVIRONMENT=${{ inputs.environment }}
            VITE_API_BASE_URL=${{ secrets.vite-api-base-url }}
            VITE_NOTIFICATIONS_URL=${{ secrets.vite-notifications-url }}
            VITE_ENVIRONMENT=${{ inputs.environment }}
