[tool.uv.workspace]
members = [
    "services/core",
    "services/api",
    "services/notifications",
    "services/jobs",
]

# Herramientas de desarrollo compartidas por todos los servicios
# uv las instala con: uv sync --all-packages (incluye dev groups por defecto)
[dependency-groups]
dev = [
    "ruff>=0.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-env>=1.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "__pycache__", "alembic/versions", "notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "W191"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["slate_core", "slate_api", "slate_notifications", "slate_jobs"]

[tool.pytest.ini_options]
testpaths = ["services"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--strict-config"]
env = [
    "ENVIRONMENT=test",
]
