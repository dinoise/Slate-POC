[project]
name = "slate-notifications"
version = "0.1.0"
description = "Notification service for Slate — pg_notify listener and SSE broadcaster"
requires-python = ">=3.11"
dependencies = [
    # Internal workspace packages
    "slate-core",
    # FastAPI Core
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.1.0",
    # Database (asyncpg for LISTEN/NOTIFY, no ORM needed)
    "asyncpg>=0.29.0",
    # HTTP Client
    "httpx>=0.26.0",
    # Google Auth — verificación de ID tokens de GIS (requests extra incluye transport HTTP)
    "google-auth[requests]>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-env>=1.1.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slate_notifications"]

[tool.uv.sources]
slate-core = { workspace = true }
