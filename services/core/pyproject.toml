[project]
name = "slate-core"
version = "0.1.0"
description = "Shared geospatial and optimization library for Despacho"
requires-python = ">=3.11"
dependencies = [
    # Geospatial
    "geoalchemy2>=0.14.0",
    "shapely>=2.0.0",
    "h3>=3.7.0",
    # Optimization
    "ortools>=9.8.0",
    # ML & Data
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # HTTP Client
    "httpx>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slate_core"]
