[project]
name = "slate-infra"
version = "0.1.0"
description = "Shared infrastructure for Slate services — auth, config, logging, exceptions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic-settings>=2.1.0",
    "google-auth[requests]>=2.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slate_infra"]
