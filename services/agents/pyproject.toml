[project]
name = "slate-agents"
version = "0.1.0"
description = "Slate AI agents — deployed to Vertex AI Agent Engine via ADK"
requires-python = ">=3.11"

dependencies = [
    # ── Google ADK + Vertex AI ──────────────────────────────────
    "google-adk>=1.31.1",
    "google-cloud-aiplatform[adk,agent-engines]>=1.118.0",

    # ── Google Auth ─────────────────────────────────────────────
    "google-auth>=2.36.0",

    # ── Config ──────────────────────────────────────────────────
    "pydantic-settings>=2.8.0",
    "python-dotenv>=1.0.0",

    # ── HTTP (para tools que llaman slate-api) ──────────────────
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "cloudpickle>=3.0", # pre-deploy pickle validation
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slate_agents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
