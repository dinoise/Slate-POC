<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vista Ajustador</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/map.css') }}" />
  <style>
    .sidebar { width: 320px; overflow-y: auto; }
    select, input[type="text"] {
      width: 100%; background: #0f172a; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 4px;
      padding: 6px 8px; font-size: 12px; margin-top: 4px;
    }
    label { font-size: 11px; color: #64748b; margin-top: 8px; display: block; }
    .badge {
      font-size: 10px; padding: 2px 10px; border-radius: 10px;
      border: 1px solid #334155; background: #0f172a; color: #64748b;
    }
    .badge.connected  { border-color: #22c55e; color: #22c55e; background: #14532d22; }
    .badge.reconnecting { border-color: #f97316; color: #f97316; background: #7c2d1222; }
    .assignment-card {
      margin-top: 8px; padding: 10px; background: #0f172a;
      border: 1px solid #6366f1; border-radius: 6px;
    }
    .assignment-card .field { font-size: 12px; margin-bottom: 4px; color: #cbd5e1; }
    .assignment-card .field strong { color: #e2e8f0; }
    .action-btns { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .action-btn {
      padding: 8px; border: none; border-radius: 6px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-accept  { background: #16a34a; color: #fff; }
    .btn-enroute { background: #2563eb; color: #fff; }
    .btn-arrived { background: #9333ea; color: #fff; }
    .btn-done    { background: #334155; color: #94a3b8; cursor: default; }
    .btn-cancel  { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; margin-top: 6px; }
    .action-btn:hover:not(.btn-done) { filter: brightness(1.15); }
    #status-box {
      margin: 8px 14px; padding: 8px; background: #0f172a;
      border-radius: 6px; font-size: 12px; color: #64748b;
    }
    .sev-dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; margin-right: 4px;
    }
  </style>
</head>
<body>

<header>
  <span style="font-size:20px">🧑‍💼</span>
  <h1>Vista Ajustador</h1>
  <span id="status-badge" class="badge" style="margin-left:12px;">Sin conexión</span>
  <a href="/" style="margin-left:auto;font-size:11px;color:#64748b;text-decoration:none;padding:3px 8px;border:1px solid #334155;border-radius:4px;">⌂ Inicio</a>
</header>

<div class="main">
  <div id="map"></div>

  <div class="sidebar">

    <div class="sidebar-section">
      <h2>Ajustador</h2>
      <select id="sel-adj" onchange="selectAdjuster(this.value)">
        <option value="">— seleccionar ajustador —</option>
      </select>
      <div id="adj-info" style="margin-top:8px;font-size:11px;color:#475569;"></div>
    </div>

    <div class="sidebar-section" id="assignment-card" style="display:none;">
      <h2>Asignación Activa</h2>
      <div class="assignment-card">
        <div class="field"><strong id="inc-type">—</strong></div>
        <div class="field" id="inc-severity"></div>
        <div class="field" id="inc-address"></div>
        <div class="field" id="inc-distance"></div>
        <div class="field" id="inc-travel"></div>
        <div class="action-btns" id="action-btns">
          <button class="action-btn btn-accept"  id="btn-accept"   onclick="updateStatus('accepted')">✅ Aceptar asignación</button>
          <button class="action-btn btn-enroute" id="btn-enroute"  onclick="updateStatus('en_route')" style="display:none;">🚗 En camino al siniestro</button>
          <button class="action-btn btn-arrived" id="btn-arrived"  onclick="updateStatus('arrived')"  style="display:none;">📍 Llegué al siniestro</button>
          <div    class="action-btn btn-done"    id="btn-done"     style="display:none;">✔ En atención</div>
          <button class="action-btn btn-cancel"  id="btn-cancel"   onclick="cancelAssignment()">✖ Cancelar asignación</button>
        </div>
      </div>
    </div>

    <div id="status-box">Selecciona un ajustador para conectarte.</div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/polyline-encoded@0.0.9/Polyline.encoded.js"></script>
<script src="https://unpkg.com/leaflet-ant-path@1.3.0/dist/leaflet-ant-path.js"></script>
<script src="{{ request.url_for('static', path='js/route-utils.js') }}?v={{ range(1000000)|random }}"></script>
<script src="{{ request.url_for('static', path='js/adjuster.js') }}?v={{ range(1000000)|random }}"></script>
</body>
</html>
