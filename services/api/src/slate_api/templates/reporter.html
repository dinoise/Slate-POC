<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reportar Siniestro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/map.css') }}" />
  <style>
    .sidebar { width: 320px; overflow-y: auto; }
    select, input[type="text"], input[type="email"], textarea {
      width: 100%; background: #0f172a; color: #e2e8f0;
      border: 1px solid #334155; border-radius: 4px;
      padding: 6px 8px; font-size: 12px; margin-top: 4px;
    }
    textarea { resize: vertical; }
    input[type="range"] { width: 100%; margin-top: 4px; accent-color: #6366f1; }
    label { font-size: 11px; color: #64748b; margin-top: 8px; display: block; }
    .submit-btn {
      width: 100%; margin-top: 10px; padding: 10px;
      background: #6366f1; color: #fff; border: none;
      border-radius: 6px; font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    .submit-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .submit-btn:hover:not(:disabled) { background: #4f46e5; }
    .confirm-card {
      margin-top: 10px; padding: 10px; background: #0f172a;
      border: 1px solid #22c55e; border-radius: 6px; font-size: 12px; color: #22c55e;
    }
    .coords-display {
      margin-top: 6px; font-size: 11px; color: #64748b;
      padding: 6px 8px; background: #0f172a; border-radius: 4px;
    }
    #status-box {
      margin: 8px 14px; padding: 8px; background: #0f172a;
      border-radius: 6px; font-size: 12px; color: #64748b;
    }
    .sev-row { display: flex; align-items: center; gap: 8px; }
    .sev-badge {
      font-size: 13px; font-weight: 700; color: #6366f1;
      min-width: 16px; text-align: center;
    }
    /* Active incidents list */
    .incident-card {
      margin-top: 8px; padding: 10px; background: #0f172a;
      border: 1px solid #334155; border-radius: 6px; font-size: 12px;
    }
    .incident-card.assigned { border-color: #22c55e; }
    .incident-card .ic-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .ic-type { font-weight: 600; color: #e2e8f0; }
    .ic-status {
      font-size: 10px; padding: 2px 8px; border-radius: 10px;
      background: #1e293b; color: #64748b; border: 1px solid #334155;
    }
    .ic-status.assigned  { color: #22c55e; border-color: #22c55e; background: #14532d22; }
    .ic-status.pending   { color: #f59e0b; border-color: #f59e0b; background: #78350f22; }
    .ic-status.en_route,
    .ic-status.accepted  { color: #6366f1; border-color: #6366f1; background: #1e1b4b22; }
    .ic-field { color: #94a3b8; margin-bottom: 3px; }
    .ic-field strong { color: #cbd5e1; }
    .adjuster-info {
      margin-top: 6px; padding: 6px 8px; background: #1e293b;
      border-radius: 4px; border-left: 3px solid #6366f1; font-size: 11px;
    }
    .adjuster-info .adj-name { font-weight: 600; color: #a5b4fc; }
    .btn-cancel-inc {
      margin-top: 8px; width: 100%; padding: 6px; border: 1px solid #dc2626;
      background: #7f1d1d; color: #fca5a5; border-radius: 4px;
      font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .btn-cancel-inc:hover { background: #991b1b; }
    #active-incidents-section { display: none; }
  </style>
</head>
<body>

<header>
  <span style="font-size:20px">🚨</span>
  <h1>Reportar Siniestro</h1>
  <a href="/" style="margin-left:auto;font-size:11px;color:#64748b;text-decoration:none;padding:3px 8px;border:1px solid #334155;border-radius:4px;">⌂ Inicio</a>
</header>

<div class="main">
  <div id="map"></div>

  <div class="sidebar">

    <div class="sidebar-section">
      <h2>Usuario Reportante</h2>
      <select id="sel-user">
        <option value="">— seleccionar usuario —</option>
      </select>
      <div style="margin-top:8px;font-size:11px;color:#475569;">
        ¿No existe? <a href="/admin" style="color:#6366f1;">Crear en Admin</a>
      </div>
    </div>

    <div class="sidebar-section">
      <h2>Ubicación del Siniestro</h2>
      <div class="coords-display" id="coords-display">
        📍 Haz click en el mapa para ubicar el siniestro
      </div>
    </div>

    <div class="sidebar-section">
      <h2>Detalles</h2>

      <label>Tipo de siniestro</label>
      <select id="sel-type">
        <option value="accidente_vial">Accidente Vial</option>
        <option value="robo">Robo</option>
        <option value="incendio">Incendio</option>
        <option value="inundacion">Inundación</option>
        <option value="daño_a_terceros">Daño a Terceros</option>
        <option value="robo_total">Robo Total</option>
        <option value="otro">Otro</option>
      </select>

      <label>Severidad</label>
      <div class="sev-row">
        <input type="range" id="sev" min="1" max="5" value="3"
               oninput="document.getElementById('sev-val').textContent=this.value" />
        <span class="sev-badge" id="sev-val">3</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:#475569;">
        <span>Leve</span><span>Grave</span>
      </div>

      <label>Descripción (opcional)</label>
      <textarea id="desc" rows="3" placeholder="Descripción del siniestro..."></textarea>

      <label>Dirección</label>
      <input type="text" id="addr" placeholder="Calle, número, colonia..." />
    </div>

    <div class="sidebar-section">
      <button class="submit-btn" id="btn-submit" onclick="submitIncident()" disabled>
        🚨 Levantar Siniestro
      </button>
      <div id="confirm-box" style="display:none;"></div>
    </div>

    <!-- Active incidents for selected user -->
    <div class="sidebar-section" id="active-incidents-section">
      <h2>Siniestros Activos</h2>
      <div id="active-incidents-list"></div>
    </div>

    <div id="status-box">Selecciona un usuario y ubica el siniestro en el mapa.</div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/polyline-encoded@0.0.9/Polyline.encoded.js"></script>
<script src="https://unpkg.com/leaflet-ant-path@1.3.0/dist/leaflet-ant-path.js"></script>
<script src="{{ request.url_for('static', path='js/route-utils.js') }}?v={{ range(1000000)|random }}"></script>
<script src="{{ request.url_for('static', path='js/reporter.js') }}?v={{ range(1000000)|random }}"></script>
</body>
</html>
