<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Usuarios</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/map.css') }}" />
  <style>
    body { overflow: auto; }
    .content {
      flex: 1; padding: 20px; overflow-y: auto;
      max-width: 900px; margin: 0 auto; width: 100%;
    }
    .user-form {
      display: none; background: #1e293b; border: 1px solid #334155;
      border-radius: 8px; padding: 16px; margin-bottom: 16px;
    }
    .user-form h3 { font-size: 13px; color: #94a3b8; margin-bottom: 12px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; color: #64748b; }
    .form-group input {
      background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
      border-radius: 4px; padding: 6px 8px; font-size: 12px;
    }
    .form-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn {
      padding: 8px 16px; border: none; border-radius: 6px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-ghost   { background: #334155; color: #94a3b8; }
    .btn-ghost:hover { background: #475569; }
    .btn-danger  { background: #dc2626; color: #fff; font-size: 11px; padding: 4px 10px; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-edit    { background: #0f172a; color: #6366f1; border: 1px solid #6366f1; font-size: 11px; padding: 4px 10px; }
    .btn-edit:hover { background: #1e293b; }
    table {
      width: 100%; border-collapse: collapse;
      background: #1e293b; border-radius: 8px; overflow: hidden;
    }
    th {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
      color: #64748b; padding: 10px 14px; text-align: left;
      border-bottom: 1px solid #334155; background: #0f172a;
    }
    td { padding: 10px 14px; font-size: 12px; border-bottom: 1px solid #1e293b; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #0f172a44; }
    .empty-row td { color: #475569; text-align: center; padding: 24px; }
    #toast {
      display: none; position: fixed; bottom: 20px; right: 20px;
      background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      padding: 10px 16px; font-size: 12px; color: #e2e8f0;
      box-shadow: 0 4px 12px rgba(0,0,0,.4); z-index: 999;
    }
  </style>
</head>
<body>

<header>
  <span style="font-size:20px">👤</span>
  <h1>Gestión de Usuarios</h1>
  <div style="margin-left:auto;display:flex;gap:10px;align-items:center;">
    <a href="/" style="font-size:11px;color:#64748b;text-decoration:none;padding:3px 8px;border:1px solid #334155;border-radius:4px;">⌂ Inicio</a>
    <button class="btn btn-primary" onclick="showForm()">+ Nuevo Usuario</button>
  </div>
</header>

<div style="display:flex;flex:1;overflow:auto;">
<div class="content">

  <!-- Create / Edit form -->
  <div class="user-form" id="user-form">
    <h3 id="form-title">Nuevo Usuario</h3>
    <div class="form-grid">
      <div class="form-group">
        <label>Nombre *</label>
        <input type="text" id="f-fname" placeholder="Nombre" />
      </div>
      <div class="form-group">
        <label>Apellido *</label>
        <input type="text" id="f-lname" placeholder="Apellido" />
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" id="f-email" placeholder="correo@ejemplo.com" />
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" id="f-phone" placeholder="55 1234 5678" />
      </div>
    </div>
    <div id="form-error" style="color:#f87171;font-size:11px;margin-top:8px;display:none;"></div>
    <div class="form-actions">
      <button class="btn btn-primary" onclick="submitForm()">💾 Guardar</button>
      <button class="btn btn-ghost"   onclick="hideForm()">Cancelar</button>
    </div>
  </div>

  <!-- Users table -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Teléfono</th>
        <th>Creado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="users-tbody">
      <tr class="empty-row"><td colspan="6">Cargando...</td></tr>
    </tbody>
  </table>

</div>
</div>

<div id="toast"></div>

<script src="{{ request.url_for('static', path='js/admin.js') }}?v={{ range(1000000)|random }}"></script>
</body>
</html>
