[project]
name = "slate-api"
version = "0.1.0"
description = "FastAPI service for Slate — incident dispatch and adjuster assignment"
requires-python = ">=3.11"
dependencies = [
    # Internal workspace packages
    "slate-core",
    # FastAPI Core
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.1.0",
    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    # Redis
    "redis[hiredis]>=5.0.0",
    # HTTP Client
    "httpx>=0.26.0",
    # Google Auth — verificación de ID tokens de GIS (requests extra incluye transport HTTP)
    "google-auth[requests]>=2.28.0",
    # Utilities
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-env>=1.1.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slate_api"]

[tool.uv.sources]
slate-core = { workspace = true }
